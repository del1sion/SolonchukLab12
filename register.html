<main class="form-main"><form class="register-form" action="#" method="get">
<h2>Реєстрація користувача</h2>
<label for="surname">Прізвище</label><input id="surname" name="surname" type="text" placeholder="Введіть прізвище" required>
<label for="name">Ім’я</label><input id="name" name="name" type="text" placeholder="Введіть ім’я" required>
<label for="login">Логін</label><input id="login" name="login" type="text" placeholder="Придумайте логін" required>
<label for="group">Навчальна група</label><select id="group" name="group" required><option value="281">281</option><option value="101">101</option><option value="102">102</option><option value="103">103</option></select>
<label for="password">Пароль</label><input id="password" name="password" type="password" required>
<label for="confirm">Підтвердження паролю</label><input id="confirm" name="confirm" type="password" required>
<button type="submit">Зареєструватись</button>
</form></main><footer>© Всі права захищені.</footer></body></html>
